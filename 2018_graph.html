<!doctype html>
<html><head><meta charset="utf-8">
<title>2018 — activity split</title>
<style>
  html,body{margin:0;padding:0;background:transparent;}

  /* Two drawings of the same graph, one per shape. The wide one is
     1280x146; the narrow one keeps the 48px rows and the same label size
     but reflows to 375x197, so nothing shrinks on a phone. Only one is
     ever in the document flow. */
  #wrap{width:100%;}
  #wrap svg{width:100%;height:auto;}
  #wrap svg.wide{display:block;}
  #wrap svg.narrow{display:none;}
  @media (max-width: 767px){
    #wrap svg.wide{display:none;}
    #wrap svg.narrow{display:block;}
  }

  .rule,.bar,.label{
    animation-duration:13.85s;
    animation-timing-function:cubic-bezier(.33,0,.2,1);
    animation-iteration-count:infinite;
    animation-fill-mode:both;
  }

  /* The rules draw first, slowly, right across the full width. */
  .rule{animation-name:hair;}
  @keyframes hair{
    0%                        {clip-path:inset(0 100% 0 0);}
    33.33%       {clip-path:inset(0 0 0 0);}
    86.67%   {clip-path:inset(0 0 0 0);}
    97.78%,100% {clip-path:inset(0 100% 0 0);}
  }

  /* Each bar sweeps out of the left edge of its own row: blue, black,
     coral. They clear in the opposite order, so the exit reads as a
     sequence too. */
    .b0{animation-name:wipe0;}
    @keyframes wipe0{
      0%,4.44%   {clip-path:inset(0 100% 0 0);}
      23.22%      {clip-path:inset(0 0 0 0);}
      83.33%      {clip-path:inset(0 0 0 0);}
      95.94%,100% {clip-path:inset(0 100% 0 0);}
    }
    .b1{animation-name:wipe1;}
    @keyframes wipe1{
      0%,13.33%   {clip-path:inset(0 100% 0 0);}
      32.11%      {clip-path:inset(0 0 0 0);}
      79.44%      {clip-path:inset(0 0 0 0);}
      92.06%,100% {clip-path:inset(0 100% 0 0);}
    }
    .b2{animation-name:wipe2;}
    @keyframes wipe2{
      0%,22.22%   {clip-path:inset(0 100% 0 0);}
      41.00%      {clip-path:inset(0 0 0 0);}
      75.56%      {clip-path:inset(0 0 0 0);}
      88.17%,100% {clip-path:inset(0 100% 0 0);}
    }

  /* Text arrives once all three bars are in, and leaves just ahead of
     the bar it sits on. */
    .l0{animation-name:rise0;}
    @keyframes rise0{
      0%,36.67%   {opacity:0;transform:translateY(5px);}
      48.89%      {opacity:1;transform:translateY(0);}
      81.11%      {opacity:1;transform:translateY(0);}
      90.00%,100% {opacity:0;transform:translateY(5px);}
    }
    .l1{animation-name:rise1;}
    @keyframes rise1{
      0%,41.67%   {opacity:0;transform:translateY(5px);}
      53.89%      {opacity:1;transform:translateY(0);}
      77.22%      {opacity:1;transform:translateY(0);}
      86.11%,100% {opacity:0;transform:translateY(5px);}
    }
    .l2{animation-name:rise2;}
    @keyframes rise2{
      0%,46.67%   {opacity:0;transform:translateY(5px);}
      58.89%      {opacity:1;transform:translateY(0);}
      73.33%      {opacity:1;transform:translateY(0);}
      82.22%,100% {opacity:0;transform:translateY(5px);}
    }

  @media (prefers-reduced-motion: reduce){
    .rule,.bar,.label{animation:none;clip-path:none;opacity:1;transform:none;}
  }
</style></head>
