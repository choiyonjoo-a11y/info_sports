<!doctype html>
<html><head><meta charset="utf-8">
<title>trace — homepage supergraphic</title>
<style>
  :root{
    /* one palette block: change these three and the whole piece follows */
    --ink:   #121212;
    --coral: #FD6663;
    --blue:  #7CB3D0;
    /* overall size of the graphic. 1.3 = 30% larger than the base drawing. */
    --base: 1.3;
    /* drop toward .22 to sit the graphic behind large type */
    --strength: 1;
  }
  html,body{margin:0;padding:0;background:transparent;}
  body{display:grid;place-items:center;min-height:100vh;}

  /* 1448x982 design size; scales down for a narrower embed block.
     No background: whatever sits behind the embed shows through. */
  #frame{
    position:relative;
    width:min(1448px,100vw);
    aspect-ratio:1448/982;
    overflow:hidden;
    background:transparent;
  }
  #frame > svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #field{opacity:var(--strength);}

  /* The zoom, on its own clock. Translate is written before scale so the
     offset stays in frame units at any magnification. Every step is
     multiplied by --base, so one number resizes the whole piece. */
  #camera{
    transform-box:view-box;
    transform-origin:724.0px 491.0px;
    animation:camera 145.8s cubic-bezier(.37,0,.63,1) infinite;
    will-change:transform;
  }
  @keyframes camera{
    0%   {transform:translate(150px,0)      scale(calc(1.18 * var(--base)));}
    20%  {transform:translate(-96px,52px)   scale(calc(1.02 * var(--base)));}
    40%  {transform:translate(232px,-148px) scale(calc(2.05 * var(--base)));}
    58%  {transform:translate(-268px,176px) scale(calc(3.30 * var(--base)));}
    78%  {transform:translate(154px,-104px) scale(calc(5.90 * var(--base)));}
    100% {transform:translate(150px,0)      scale(calc(1.18 * var(--base)));}
  }

  /* A second, much longer drift on top of the zoom. None of the four
     periods divides into another, so the piece never retraces its path. */
  #drift{
    transform-box:view-box;
    transform-origin:724.0px 491.0px;
    animation:drift 236.4s cubic-bezier(.42,0,.58,1) infinite;
  }
  @keyframes drift{
    0%,100% {transform:translate(0,0);}
    27%     {transform:translate(74px,-46px);}
    58%     {transform:translate(-58px,68px);}
    81%     {transform:translate(36px,30px);}
  }

  #turn{
    transform-box:view-box;
    transform-origin:724.0px 491.0px;
    animation:spin 566.4s linear infinite;
  }
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  /* Every shape sweeps clockwise out of the centre line, rests 1s at the
     closed circle, then unwinds. The base timing is linear so the flat
     stretches stay flat; the easing is attached to the two moving segments
     only, which is what makes each ring start and stop softly. */
  .band{stroke-linecap:butt;stroke-dasharray:0 var(--rest);will-change:stroke-dasharray;}
    .b0{animation:sweep0 62.4s linear infinite;}
    @keyframes sweep0{
      0%               {stroke-dasharray:0 var(--rest);}
      23.37%     {stroke-dasharray:0 var(--rest);
                        animation-timing-function:cubic-bezier(.65,0,.35,1);}
      53.65%     {stroke-dasharray:var(--full) var(--rest);}
      55.26%     {stroke-dasharray:var(--full) var(--rest);
                        animation-timing-function:cubic-bezier(.65,0,.35,1);}
      81.22%,100% {stroke-dasharray:0 var(--rest);}
    }
    .b1{animation:sweep1 62.4s linear infinite;}
    @keyframes sweep1{
      0%               {stroke-dasharray:0 var(--rest);}
      15.58%     {stroke-dasharray:0 var(--rest);
                        animation-timing-function:cubic-bezier(.65,0,.35,1);}
      45.87%     {stroke-dasharray:var(--full) var(--rest);}
      60.45%     {stroke-dasharray:var(--full) var(--rest);
                        animation-timing-function:cubic-bezier(.65,0,.35,1);}
      86.41%,100% {stroke-dasharray:0 var(--rest);}
    }
    .b2{animation:sweep2 62.4s linear infinite;}
    @keyframes sweep2{
      0%               {stroke-dasharray:0 var(--rest);}
      7.79%     {stroke-dasharray:0 var(--rest);
                        animation-timing-function:cubic-bezier(.65,0,.35,1);}
      38.08%     {stroke-dasharray:var(--full) var(--rest);}
      65.64%     {stroke-dasharray:var(--full) var(--rest);
                        animation-timing-function:cubic-bezier(.65,0,.35,1);}
      91.60%,100% {stroke-dasharray:0 var(--rest);}
    }
    .b3{animation:sweep3 62.4s linear infinite;}
    @keyframes sweep3{
      0%               {stroke-dasharray:0 var(--rest);}
      0.00%     {stroke-dasharray:0 var(--rest);
                        animation-timing-function:cubic-bezier(.65,0,.35,1);}
      30.29%     {stroke-dasharray:var(--full) var(--rest);}
      70.83%     {stroke-dasharray:var(--full) var(--rest);
                        animation-timing-function:cubic-bezier(.65,0,.35,1);}
      96.79%,100% {stroke-dasharray:0 var(--rest);}
    }

  @media (prefers-reduced-motion: reduce){
    #camera,#drift,#turn,.band{animation:none;}
    #camera{transform:translate(150px,0) scale(calc(1.02 * var(--base)));}
    .band{stroke-dasharray:var(--full) var(--rest);}
  }
</style></head>
<body>
<div id="frame">
  <svg viewBox="0 0 1448 982" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <g id="camera">
      <g id="drift">
        <g id="turn">
        <g id="field">
          <path class="band b0" d="M724.00,61.38 A429.62,429.62 0 1 1 724.00,920.62 A429.62,429.62 0 1 1 724.00,61.38 Z" fill="none" stroke="var(--coral)" stroke-width="122.75" stroke-linejoin="round" style="--full:2704.8px;--rest:2834.4px"/>
          <path class="band b1" d="M724.00,184.12 A306.88,306.88 0 1 1 724.00,797.88 A306.88,306.88 0 1 1 724.00,184.12 Z" fill="none" stroke="var(--ink)" stroke-width="122.75" stroke-linejoin="round" style="--full:1932.0px;--rest:2024.6px"/>
          <path class="band b2" d="M724.00,282.30 A208.70,208.70 0 1 1 724.00,699.70 A208.70,208.70 0 1 1 724.00,282.30 Z" fill="none" stroke="var(--blue)" stroke-width="73.60" stroke-linejoin="round" style="--full:1313.9px;--rest:1376.9px"/>
          <path class="band b3" d="M724.00,405.05 A85.95,85.95 0 1 1 724.00,576.95 A85.95,85.95 0 1 1 724.00,405.05 Z" fill="none" stroke="var(--ink)" stroke-width="171.90" stroke-linejoin="round" style="--full:541.1px;--rest:567.0px"/>
        </g>
        </g>
      </g>
    </g>
  </svg>
</div>
</body></html>
