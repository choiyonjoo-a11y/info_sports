<script>
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const eIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const revealRect=document.getElementById('revealRect');
const END=10000, START=300, DUR=7400;
let t0=performance.now();
function frame(now){
 const T=(now-t0)%END;
 const rv = T<START ? 0 : eIO(clamp((T-START)/DUR,0,1));
 revealRect.setAttribute('width',(1920*Math.min(rv,1)).toFixed(0));
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
