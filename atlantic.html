<!doctype html>
<html><head><meta charset="utf-8">
<title>atlantic — nested donut</title>
<style>
  html,body{margin:0;padding:0;background:transparent;}
  body{display:grid;place-items:center;min-height:100vh;}
  /* 456 is the design size; shrinks to fit a narrower embed block */
  #wrap{width:min(456px,100vw,100vh);aspect-ratio:1;}
  #wrap svg{width:100%;height:100%;display:block;}

  .disc{
    transform-box:fill-box;
    transform-origin:center;
    animation:disc 9s ease-out infinite;
  }
  @keyframes disc{
    0%   {transform:scale(.86);opacity:0;}
    6%   {transform:scale(1);opacity:1;}
    100% {transform:scale(1);opacity:1;}
  }

  /* every arc starts fully retracted and sweeps clockwise */
  .ring, .hair{
    stroke-dasharray:var(--len);
    stroke-dashoffset:var(--len);
    animation:sweep 9s ease-in-out infinite;
  }
  @keyframes sweep{
    0%   {stroke-dashoffset:var(--len);}
    22%  {stroke-dashoffset:0;}
    88%  {stroke-dashoffset:0;}
    97%  {stroke-dashoffset:var(--len);}
    100% {stroke-dashoffset:var(--len);}
  }

  /* the outer hairline draws 25% faster: 1.98s of sweep instead of 2.64s.
     Same 9s loop, so the keyframe percentages are re-cut for that arc. */
  .line--outer{animation-name:sweepFast;}
  @keyframes sweepFast{
    0%   {stroke-dashoffset:var(--len);}
    16.5%{stroke-dashoffset:0;}
    88%  {stroke-dashoffset:0;}
    97%  {stroke-dashoffset:var(--len);}
    100% {stroke-dashoffset:var(--len);}
  }

  /* inside out: red, then black, then blue.
     the hairlines fall between them, offset so they read as
     their own layer rather than riding along with the bands */
  .ring--red   {animation-delay:.35s;}
  .line--inner {animation-delay:.95s;}
  .ring--black {animation-delay:1.15s;}
  .line--outer {animation-delay:1.95s;}
  .ring--blue  {animation-delay:2.35s;}
</style></head>
<body>
<div id="wrap">
<svg viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
  <circle class="disc" cx="228" cy="228" r="228" fill="#F0EEE9"/>
  <path class="ring ring--red" d="M228.00,160.00 A68,68 0 0 1 290.59,201.43" fill="none" stroke="#FD6663" stroke-width="48" style="--len:79.5"/>
  <path class="ring ring--black" d="M228.00,112.00 A116,116 0 1 1 117.28,193.39" fill="none" stroke="#000000" stroke-width="48" style="--len:581.8"/>
  <path class="ring ring--blue" d="M228.00,64.00 A164,164 0 0 1 245.14,64.90" fill="none" stroke="#7CB3D0" stroke-width="48" style="--len:17.2"/>
  <path class="hair line--outer" d="M228.00,40.00 A188,188 0 1 1 40.00,228.00" fill="none" stroke="#121212" stroke-width="1" style="--len:885.9"/>
  <path class="hair line--inner" d="M228.00,184.00 A44,44 0 0 1 272.00,228.00" fill="none" stroke="#121212" stroke-width="1" style="--len:69.1"/>
</svg>
</div>
</body></html>
